name: Build release Docker image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'master'

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  verify_build:
    name: Verify build
    uses: ./.github/workflows/verify-build.yml

  build_docker_image:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    name: Build docker image
    runs-on: ubuntu-latest
    needs: verify_build
    continue-on-error: true
    outputs:
      image_tag: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag version - semantic release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AUTH_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image_tag=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            version="${{ steps.semantic.outputs.new_release_version }}"
            if [ -z "$version" ]; then
              version="snapshot"
            fi
            echo "image_tag=$version-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request' || steps.semantic.outputs.new_release_published == 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.image_tag }}
          build-args: |
            NEW_VERSION=${{ steps.tag.outputs.image_tag }}

  send_docker_image_report:
    name: Send docker image report
    needs: build_docker_image
    uses: ricdotnet-org/workflows/.github/workflows/docker-image-report.yml@main
    with:
      project: ${{ github.event.repository.name }}
      docker_image_status: ${{ needs.build_docker_image.result }}
      docker_image_name: ghcr.io/${{ github.repository }}:${{ needs.build_docker_image.image_tag }}
      new_release_version: ${{ needs.build_docker_image.image_tag }}
      repository: https://github.com/${{ github.repository }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
